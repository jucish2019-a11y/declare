<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <title>Declare - Card Game</title>
    <style>
        :root {
            --bg-deep: #1a1a2e;
            --bg-mid: #252540;
            --text-gold: #c9a227;
            --text-gold-dim: #8a7a42;
            --text-muted: #6a5a32;
            --border-muted: #4a3a22;
            --overlay-z: 200;
            --font-base: clamp(14px, 2.5vw, 18px);
        }

        html, body {
            margin: 0; padding: 0;
            background: var(--bg-deep);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%; height: 100%;
            height: 100dvh;
            overflow: hidden;
            font-size: var(--font-base);
        }

        #canvas {
            border: 2px solid var(--text-gold);
            border-radius: 8px;
            touch-action: none;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
            width: 100%;
            height: 100%;
            image-rendering: auto;
        }

        #loading {
            color: var(--text-gold);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            text-align: center;
        }

        #rotate-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg-deep);
            color: var(--text-gold);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            text-align: center;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: var(--overlay-z);
            padding: 1rem;
            box-sizing: border-box;
        }

        #rotate-overlay .rotate-icon {
            font-size: clamp(3rem, 12vw, 4rem);
            margin-bottom: 1rem;
            animation: rotate-phone 2s ease-in-out infinite;
        }

        #rotate-overlay .rotate-text {
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            font-weight: bold;
            margin-bottom: 0.6rem;
            padding: 0 1rem;
        }

        #rotate-overlay .rotate-sub {
            font-size: clamp(0.85rem, 3vw, 1rem);
            color: var(--text-gold-dim);
            margin-bottom: 1.5rem;
            padding: 0 1rem;
        }

        #rotate-overlay .rotate-continue {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-muted);
            padding: 0.65rem 1.5rem;
            border-radius: 8px;
            font-size: clamp(0.8rem, 2.5vw, 0.95rem);
            cursor: pointer;
            min-width: 44px;
            min-height: 44px;
        }

        @keyframes rotate-phone {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }

        @media (max-width: 600px) {
            :root {
                --font-base: clamp(12px, 3.5vw, 16px);
            }
            #canvas {
                border-width: 1px;
                border-radius: 4px;
            }
        }
    </style>
</head>
<body>
    <div id="loading">Loading Declare...</div>
    <div id="rotate-overlay">
        <div class="rotate-icon">📱</div>
        <div class="rotate-text">Rotate your device to landscape</div>
        <div class="rotate-sub">This game is best played in landscape mode</div>
        <button class="rotate-continue" onclick="_dismiss_rotate()">Continue Anyway</button>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        var _rotate_dismissed = false;
        function _is_portrait() {
            if (typeof window.orientation !== 'undefined') {
                return window.orientation === 0 || window.orientation === 180;
            }
            return window.innerWidth < window.innerHeight;
        }
        function _check_orientation() {
            if (_rotate_dismissed) return;
            var overlay = document.getElementById('rotate-overlay');
            var canvas = document.getElementById('canvas');
            if (!overlay || !canvas) return;
            if (_is_portrait()) {
                overlay.style.display = 'flex';
                canvas.style.display = 'none';
            } else {
                overlay.style.display = 'none';
                canvas.style.display = 'block';
            }
        }
        function _dismiss_rotate() {
            _rotate_dismissed = true;
            var overlay = document.getElementById('rotate-overlay');
            var canvas = document.getElementById('canvas');
            if (overlay) overlay.style.display = 'none';
            if (canvas) canvas.style.display = 'block';
        }
        window.addEventListener('resize', _check_orientation);
        window.addEventListener('orientationchange', _check_orientation);

        function _dpr_setup() {
            var canvas = document.getElementById('canvas');
            var dpr = window.devicePixelRatio || 1;
            var vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
            var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            canvas.width = Math.floor(vw * dpr);
            canvas.height = Math.floor(vh * dpr);
            canvas.style.width = vw + 'px';
            canvas.style.height = vh + 'px';
        }
        window.onload = function() {
            document.getElementById('loading').style.display = 'none';
            _dpr_setup();
            _check_orientation();
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(function() {});
            }
        };
    </script>
</body>
</html>
