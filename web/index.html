<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <title>Declare - Card Game</title>
    <style>
        html, body { margin: 0; padding: 0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; height: 100dvh; overflow: hidden; }
        #canvas { border: 2px solid #c9a227; border-radius: 8px; touch-action: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; width: 100%; height: 100%; }
        #loading { color: #c9a227; font-family: sans-serif; font-size: 24px; text-align: center; }
        #rotate-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #1a1a2e;
            color: #c9a227;
            font-family: sans-serif;
            text-align: center;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 999999;
        }
        #rotate-overlay .rotate-icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: rotate-phone 2s ease-in-out infinite;
        }
        #rotate-overlay .rotate-text {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
            padding: 0 24px;
        }
        #rotate-overlay .rotate-sub {
            font-size: 15px;
            color: #8a7a42;
            margin-bottom: 32px;
            padding: 0 32px;
        }
        #rotate-overlay .rotate-continue {
            background: transparent;
            color: #6a5a32;
            border: 1px solid #4a3a22;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        @keyframes rotate-phone {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
    </style>
</head>
<body>
    <div id="loading">Loading Declare...</div>
    <div id="rotate-overlay">
        <div class="rotate-icon">📱</div>
        <div class="rotate-text">Rotate your device to landscape</div>
        <div class="rotate-sub">This game is best played in landscape mode</div>
        <button class="rotate-continue" onclick="_dismiss_rotate()">Continue Anyway</button>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        var _rotate_dismissed = false;
        function _is_portrait() {
            if (typeof window.orientation !== 'undefined') {
                return window.orientation === 0 || window.orientation === 180;
            }
            return window.innerWidth < window.innerHeight;
        }
        function _check_orientation() {
            if (_rotate_dismissed) return;
            var overlay = document.getElementById('rotate-overlay');
            var canvas = document.getElementById('canvas');
            if (!overlay || !canvas) return;
            if (_is_portrait()) {
                overlay.style.display = 'flex';
                canvas.style.display = 'none';
            } else {
                overlay.style.display = 'none';
                canvas.style.display = 'block';
            }
        }
        function _dismiss_rotate() {
            _rotate_dismissed = true;
            var overlay = document.getElementById('rotate-overlay');
            var canvas = document.getElementById('canvas');
            if (overlay) overlay.style.display = 'none';
            if (canvas) canvas.style.display = 'block';
        }
        window.addEventListener('resize', _check_orientation);
        window.addEventListener('orientationchange', _check_orientation);

        function _dpr_setup() {
            var canvas = document.getElementById('canvas');
            var dpr = window.devicePixelRatio || 1;
            var vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
            var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            canvas.width = Math.floor(vw * dpr);
            canvas.height = Math.floor(vh * dpr);
            canvas.style.width = vw + 'px';
            canvas.style.height = vh + 'px';
        }
        window.onload = function() {
            document.getElementById('loading').style.display = 'none';
            _dpr_setup();
            _check_orientation();
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(function() {});
            }
        };
    </script>
</body>
</html>
