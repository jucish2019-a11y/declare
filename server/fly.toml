# Fly.io app config for the Declare multiplayer server.
#
# Deploy:
#   cd server
#   fly launch --no-deploy        # generate / claim app name (one-time)
#   fly deploy
#
# Auto-stop machines + min_machines_running = 0 means the VM scales to zero
# when no one's connected, so a hobby room is essentially free.

app = "declare-online"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
